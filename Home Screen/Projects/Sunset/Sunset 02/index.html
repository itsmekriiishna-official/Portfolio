    <!-- Main Content -->
    <div class="site-main">
      <div class="page ss-page">
        <div class="ss-lead">
          <h1 class="page-lead"><span class="hero-title">Design Your Sunset</span></h1>
        </div>

        <div class="ss-grid">
          <!-- Canvas Stage -->
          <div class="ss-stage">
            <canvas
              class="ss-canvas"
              id="sunset-canvas"
              style="aspect-ratio: 3840 / 2160; max-width: min(100%, calc(68vh * 1.7778));"
            ></canvas>
          </div>

          <!-- Controls Panel -->
          <div class="ss-controls">
            <!-- Size Selection -->
            <div class="ss-group">
              <h2 class="ss-label">Size</h2>
              <div class="ss-btnrow" id="size-row">
                <button type="button" class="ss-btn ss-size is-active" data-size="Desktop">Desktop<span class="ss-sizedims">3840&times;2160</span></button>
                <button type="button" class="ss-btn ss-size" data-size="Tablet">Tablet<span class="ss-sizedims">2048&times;2732</span></button>
                <button type="button" class="ss-btn ss-size" data-size="Phone">Phone<span class="ss-sizedims">1290&times;2796</span></button>
              </div>
            </div>

            <!-- Presets Selection -->
            <div class="ss-group">
              <h2 class="ss-label">Presets</h2>
              <div class="ss-btnrow" id="preset-row">
                <button type="button" class="ss-btn ss-preset is-active" data-preset="Last light">Last light</button>
                <button type="button" class="ss-btn ss-preset" data-preset="Dusty">Dusty</button>
                <button type="button" class="ss-btn ss-preset" data-preset="Golden hour">Golden hour</button>
              </div>
            </div>

            <!-- Atmosphere Controls -->
            <div class="ss-group">
              <div class="ss-grouphead">
                <h2 class="ss-label">Atmosphere</h2>
                <button type="button" class="ss-reset" id="btn-reset">Reset</button>
              </div>

              <div class="ss-row">
                <label for="ss-warmth">Warmth</label>
                <input id="ss-warmth" type="range" min="0" max="100" value="45" style="background: linear-gradient(to right, #ee7202 45%, #f2eee8 0);" />
                <output for="ss-warmth" id="output-warmth">45</output>
              </div>

              <div class="ss-row">
                <label for="ss-glow">Horizon glow</label>
                <input id="ss-glow" type="range" min="0" max="100" value="90" style="background: linear-gradient(to right, #ee7202 90%, #f2eee8 0);" />
                <output for="ss-glow" id="output-glow">90</output>
              </div>

              <div class="ss-row">
                <label for="ss-haze">Haze</label>
                <input id="ss-haze" type="range" min="0" max="100" value="12" style="background: linear-gradient(to right, #ee7202 12%, #f2eee8 0);" />
                <output for="ss-haze" id="output-haze">12</output>
              </div>

              <div class="ss-row">
                <label for="ss-dusk">Dusk depth</label>
                <input id="ss-dusk" type="range" min="0" max="100" value="70" style="background: linear-gradient(to right, #ee7202 70%, #f2eee8 0);" />
                <output for="ss-dusk" id="output-dusk">70</output>
              </div>

              <div class="ss-row">
                <label for="ss-horizon">Horizon line</label>
                <input id="ss-horizon" type="range" min="30" max="95" value="88" style="background: linear-gradient(to right, #ee7202 89.23076923076924%, #f2eee8 0);" />
                <output for="ss-horizon" id="output-horizon">88</output>
              </div>

              <div class="ss-btnrow ss-exportrow">
                <button type="button" class="ss-btn" id="btn-copy-css">Copy CSS</button>
                <button type="button" class="ss-btn ss-primary" id="btn-download-png">Download PNG</button>
              </div>
            </div>
          </div>
